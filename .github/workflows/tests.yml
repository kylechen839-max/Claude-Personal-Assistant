name: tests

# Runs the offline test suite on every push and pull request, and once a
# week so breakage from new library releases shows up even without pushes.
# Live-service tests skip themselves (no secrets are given to the pytest
# jobs; only api-contract gets ANTHROPIC_API_KEY, for tests/test_contract.py).
on:
  push:
  pull_request:
  schedule:
    - cron: "17 13 * * 1"  # Mondays 13:17 UTC
  workflow_dispatch:

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # stands in for the Raspberry Pi
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest  # Kyle's PC
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: System audio/TTS libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          # The runner image's Microsoft package repo started answering 403
          # (2026-10-22), which fails or hangs apt-get update; nothing here
          # comes from it, so drop it before updating. The
          # Azure Ubuntu mirror is also slow that day: skip recommended extras.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 espeak-ng libespeak1 libportaudio2 ffmpeg shellcheck

      - name: Lint shell scripts (Linux)
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh scripts/ci/*.sh

      # Windows PowerShell 5.1 (what Kyle's PC runs the preflight with):
      # parse every .ps1, then PSScriptAnalyzer when the image has it.
      - name: Check PowerShell scripts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem scripts -Filter *.ps1 -Recurse) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { "$($f.Name): $_" }; $failed = $true }
          }
          if ($failed) { exit 1 }
          if (Get-Module -ListAvailable PSScriptAnalyzer) {
            $found = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning,Error
            $found | Format-Table -AutoSize | Out-String -Width 200
            if ($found) { exit 1 }
            "PSScriptAnalyzer: no warnings"
          } else {
            "PSScriptAnalyzer not installed on this image; parse check only"
          }

      # base.en (most real-Whisper tests, the Pi's and the server's model)
      # and small.en (the PC default: tests/test_stt.py's short answers and
      # the end-to-end test). A cold cache downloads both, ~550 MB.
      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base.en-small.en-${{ runner.os }}

      # The real Piper tests download this voice into voices/ when it's missing.
      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voice-en_US-lessac-medium

      # The real Kokoro tests download the int8 model and voices into
      # models/kokoro/ (checksum-verified) when they're missing.
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: models/kokoro
          key: kokoro-v1.0-int8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # requirements.txt leaves openWakeWord out on Linux: its metadata pulls
      # in tflite-runtime, which has no wheels for newer Pythons. We only use
      # the ONNX backend, so install it without dependencies (as on the Pi).
      - name: Install openWakeWord (Linux)
        if: runner.os == 'Linux'
        run: pip install --no-deps "openwakeword>=0.6"

      # Fetched here (or found in the cache above) so a download hiccup
      # fails visibly instead of the real-Whisper tests skipping themselves.
      - name: Download Whisper models
        run: python -c "from faster_whisper.utils import download_model; [print(m, '->', download_model(m)) for m in ('base.en', 'small.en')]"

      - name: Run tests
        run: python -m pytest -rs

  # Real-API contract tests (tests/test_contract.py): the realistic
  # multi-turn conversation (tool use, thinking, two requests sharing one
  # history, the web app's voice socket) against the real Anthropic API with
  # the cheapest model and the default one. Runs on every push and pull
  # request when the ANTHROPIC_API_KEY repository secret is set; without it
  # (forks, or before Kyle adds it) the live tests skip and only the
  # contract-shaped fake runs. Make "api-contract" a required check on
  # master so a pull request that breaks a real conversation can't merge.
  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        timeout-minutes: 20
        run: |
          # The runner image's Microsoft package repo started answering 403
          # (2026-10-22), which fails or hangs apt-get update; nothing here
          # comes from it, so drop it before updating. The
          # Azure Ubuntu mirror is also slow that day: skip recommended extras.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 libportaudio2 ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Contract tests (real API when the secret is set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest -rs tests/test_contract.py

  # The phone app's backend router (Pi -> PC -> cloud failover, FAILOVER.md):
  # node:test, no packages needed.
  backend-router:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js/*.test.mjs

  # The Pinecone MCP connector (deployed separately, see render.yaml):
  # type-check, build, and check the server starts and answers its health check.
  pinecone-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pinecone-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pinecone-mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Smoke test
        env:
          PINECONE_API_KEY: dummy
          MCP_SECRET: ci-only-secret-0123456789abcdef
          PORT: "3999"
        run: |
          node dist/server.js &
          for i in $(seq 1 20); do curl -sf localhost:3999/ && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3999/mcp/wrong)" = 404

  # The cloud image (Dockerfile, deployed by render.yaml): build it with the
  # speech models baked in, start it like Render does, check /healthz and the
  # auth wall, run one spoken turn, and measure peak memory (job summary).
  docker:
    name: Docker image (cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hey-claude:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test and memory
        run: scripts/container_smoke.sh hey-claude:ci
