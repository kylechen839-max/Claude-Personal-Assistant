name: promote-stable

# Moves the `stable` branch, which home hosts update from (assistant/updater.py),
# to a master commit once BOTH `tests` and `pi-arm64` passed on that exact
# commit. Fast-forward only. Nobody pushes `stable` by hand.
#
# Signing (optional, for the updater's signature check): add the private half
# of an SSH signing key as the repository secret STABLE_SIGNING_KEY; each
# promotion then also pushes a signed tag `stable-<sha7>`. A host trusts it
# when the public key is in its allowed_signers file (README, Automatic
# updates). Without the secret no tag is made, and hosts that require
# signatures don't update.
on:
  workflow_run:
    workflows: [tests, pi-arm64]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Both workflows green on this commit?
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ok=true
          for wf in tests.yml pi-arm64.yml; do
            c=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$SHA&event=push&per_page=1" \
                  --jq '.workflow_runs[0].conclusion // "missing"')
            echo "$wf: $c"
            [ "$c" = success ] || ok=false
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Fast-forward stable
        if: steps.green.outputs.ok == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          SIGNING_KEY: ${{ secrets.STABLE_SIGNING_KEY }}
        run: |
          git fetch origin stable || true
          if git rev-parse -q --verify origin/stable >/dev/null; then
            if [ "$(git rev-parse origin/stable)" = "$SHA" ]; then
              echo "stable is already at $SHA"; exit 0
            fi
            if ! git merge-base --is-ancestor origin/stable "$SHA"; then
              echo "::error::$SHA is not a fast-forward of stable; not promoting"; exit 1
            fi
          fi
          if [ -n "$SIGNING_KEY" ]; then
            key="$RUNNER_TEMP/stable_signing_key"
            umask 077
            printf '%s\n' "$SIGNING_KEY" > "$key"
            git config user.name "stable promotion"
            git config user.email "stable-promotion@users.noreply.github.com"
            git config gpg.format ssh
            git config user.signingkey "$key"
            tag="stable-${SHA:0:7}"
            git tag -s -m "Promoted to stable after green CI" "$tag" "$SHA"
            git push origin "refs/tags/$tag"
            rm -f "$key"
          fi
          git push origin "$SHA:refs/heads/stable"
          echo "stable -> $SHA" >> "$GITHUB_STEP_SUMMARY"
