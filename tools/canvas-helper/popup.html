<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Kwil Canvas helper</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <h1>Kwil Canvas helper</h1>
  <p id="title" class="title" role="status">…</p>
  <ul id="lines"></ul>
  <div id="access-box" hidden>
    <p id="access-text" class="hint"></p>
    <button id="regrant" type="button">Allow on this site</button>
  </div>
  <div id="canvas-box" hidden>
    <button id="enable-canvas" type="button">Use as my school's Canvas</button>
  </div>
  <div id="kwil-box" hidden>
    <p id="kwil-ask" class="hint">Or, if this is your own Kwil:</p>
    <button id="enable-kwil" type="button">This is my Kwil</button>
  </div>
  <div id="switch-box" hidden>
    <p id="switch-ask" class="hint"></p>
    <button id="switch" type="button">Switch</button>
  </div>
  <p id="paired-box" hidden>
    <button id="unpair" type="button" class="danger">Unpair this browser</button>
    <button id="revoke" type="button" class="secondary">Revoke in Kwil</button>
  </p>
  <p class="hint">Reads only your own courses, with your own sign-in, like opening the pages
    yourself. Some schools' rules limit automated access; check yours. Read-only and
    rate-limited.</p>
</body>
</html>
