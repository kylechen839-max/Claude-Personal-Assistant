# Kwil settings. Secrets (API keys) go in .env, not here.
# Any value left out uses the built-in default (see kwil/config.py).

[assistant]
model = "claude-sonnet-5-5"   # CLAUDE_MODEL in the environment overrides this
max_tokens = 1500            # a ceiling, not a target: room for thinking and web search
# Ceiling for turns on `model` that offer tools (calendar, notes...): room to
# plan a schedule over several tool rounds. Only what's used is billed.
# max_tokens_tools = 4000
# How much of the conversation Claude still sees: the newest max_history / 2
# turns (each with all its tool rounds); past that the older half goes.
# max_history = 40
conversation_timeout = 300    # seconds of quiet before a new conversation starts
timezone = ""                 # e.g. "America/New_York"; empty = system time zone
language = "en"               # "zh": Mandarin replies, speech and phone page (config.mom.toml)
# Simple, short questions go to the cheaper fast model; changes, lookups and
# reasoning stay on `model` (kwil/router.py). "off" (or CLAUDE_ROUTER=off)
# sends everything to `model`. CLAUDE_FAST_MODEL overrides fast_model.
# fast_model = "claude-haiku-5-5"
# router = "auto"
# Monthly token counts and a rough cost estimate (owner only); "" = not kept.
# usage_file = "data/usage.json"

[tts]
# "auto" (default): Kokoro if its files are downloaded, else Piper, else pyttsx3.
# Or pick one: "kokoro" (most natural), "piper" (fast, best on a Raspberry Pi),
# "pyttsx3" (OS voice), "elevenlabs" (optional, paid cloud voice), "print".
# A missing voice falls back down that list, with one log line saying why.
engine = "auto"
# Kokoro: get it with  python -m kwil --download-voice kokoro
kokoro_voice = "af_heart"     # warm and calm; also af_bella, bf_emma, am_michael (README)
speed = 1.0                   # Kokoro 0.5-2.0, ElevenLabs 0.7-1.2
kokoro_model = "models/kokoro/kokoro-v1.0.int8.onnx"
kokoro_voices = "models/kokoro/voices-v1.0.bin"
# Piper voice (.onnx, with its .onnx.json next to it).
# Get one with: python -m kwil --download-voice en_US-lessac-medium
piper_voice = "voices/en_US-lessac-medium.onnx"
rate = 185                    # pyttsx3 only
voice = ""                    # pyttsx3 only: part of a voice name, e.g. "Zira" on Windows
# ElevenLabs: only with engine = "elevenlabs" and ELEVENLABS_API_KEY in .env.
elevenlabs_voice = ""         # a voice ID from your ElevenLabs library; "" = Rachel
elevenlabs_model = "eleven_flash_v2_5"
# Phone app voice picker (menu > Reply voice): each person (you, and each
# family member) picks the voice their replies are read in, from the voices
# this server has. The default above is used until they pick one.
picker = true
voices_dir = "voices"         # Piper voices found here are offered
voice_file = "data/voice_choice.json"  # your pick; a family member's is in their own folder
family_paid_voices = false    # true = family-tier members only (never beta testers) may pick ElevenLabs voices (your bill)

[stt]
model = "small.en"            # faster-whisper model (~480 MB); "base.en" on a Pi 5 or the
                              # cloud server (set there), "tiny.en" on a Pi 4: faster, mishears more
device = "cpu"
compute_type = "int8"
beam_size = 5                 # 1 = greedy (faster, mishears more); 0 = the default (5)
initial_prompt = "auto"       # "auto" = the built-in app vocabulary (calendar, assignment,
                              # Notion, reschedule, ...); "" = none; or your own text
hotwords = ""                 # extra words Whisper should favor, e.g. names: "Kyle, Kai"
engine = "whisper"            # "whisper" (local, private), or paid cloud: "openai" (needs
                              # OPENAI_API_KEY) or "deepgram" (DEEPGRAM_API_KEY); your
                              # speech is then sent to them; local Whisper on any error
cloud_model = ""              # "" = gpt-4o-transcribe (openai) / nova-3 (deepgram)
cloud_timeout = 10            # seconds before local Whisper takes over

[wake]
keyword_path = "keywords/hey_claude.onnx"  # openWakeWord model (Windows and Pi)
builtin_keyword = "hey_jarvis"  # used if keyword_path is missing: hey_jarvis, alexa, hey_mycroft, hey_rhasspy
sensitivity = 0.5             # 0-1; higher = fewer misses, more false wakes
chime = true
silence_ms = 800              # how long a pause ends your command
max_seconds = 15
no_speech_timeout = 5
follow_up_seconds = 5         # after a reply, keep listening this long without the wake word; 0 = off
follow_up_chime = true        # soft blip when that window opens (only if chime = true)
barge_in = "wake_word"        # stop a reply by talking over it: "wake_word" (say the wake word;
                              # works with speakers), "voice" (just talk; best with headphones
                              # or an echo-cancelling speakerphone) or "off" (or false)
barge_in_ms = 400             # "voice": talk this long over a reply to stop it
barge_in_echo_ratio = 2.5     # "voice": how much louder than the reply's own echo you must be
mic_device = ""               # "" = default mic

[calendar]
enabled = true
credentials = "credentials.json"
token = "token.json"
calendar_id = "primary"
# Your own names for event colors ("make it School"): name = a Google color
# (Lavender, Sage, Grape, Flamingo, Banana, Tangerine, Peacock, Graphite,
# Blueberry, Basil, Tomato) or the name of one of your Google event labels.
color_labels = {}
# e.g. color_labels = { School = "Basil", Work = "Blueberry", Gym = "Tangerine" }

[gmail]
enabled = true                # needs the Gmail scopes: python -m kwil.tools.google_auth
max_summary = 15              # most emails in one spoken summary

[notion]
enabled = true
database_id = "7eefabe3-0226-47a8-a287-584be0d2ea9b"   # Fall 2026 Assignments

[web]
enabled = true
search = true                 # search the web (runs on Anthropic's servers)
fetch = true                  # read a specific web page
browser = true                # open pages in this computer's default browser
max_searches = 3              # per question
max_fetches = 3
max_fetch_tokens = 8000       # cap on each page read
allowed_domains = []          # only use these sites, e.g. ["wikipedia.org"], or
blocked_domains = []          # never use these sites (set one list, not both)
# Approximate location for local results ("weather", "open near me").
location = { city = "", region = "", country = "", timezone = "" }
# e.g. location = { city = "Atlanta", region = "Georgia", country = "US", timezone = "America/New_York" }

[memory]
enabled = true
index = "project-context"
namespace = "voice-assistant" # where conversation summaries are written
search_namespaces = "*"       # "*" = read all namespaces, or a list like ["projects"]
top_k = 4
min_score = 0.4
text_fields = ["text", "chunk_text", "content", "summary"]  # metadata field(s) holding a note's text
weekly_review = false         # true: once a week, the first conversation offers to review this week's notes
review_state_file = "data/memory_review.json"  # when the last weekly review offer was made

[webapp]                      # python -m kwil --mode web (phone page)
host = "127.0.0.1"            # keep this: reach it through `tailscale serve`
port = 8765
confirm_timeout = 120         # seconds to wait for a yes before treating it as no
max_upload_mb = 10
max_attachment_mb = 10        # per PDF/text file attached with "+" (photos: [tutor] max_image_mb;
                              # the whole message must fit in max_upload_mb, 4 on the cloud server)
max_audio_seconds = 60        # longest recording accepted
sessions_file = "data/web_sessions.json"  # signed-in phones (sign-out revokes them)
trusted_proxy = 0             # 0 = none; 1 behind a TLS proxy such as Render; or the proxy's
                              # address, e.g. "127.0.0.1" for tailscale serve (TRUSTED_PROXY)
google_connect = false        # true: a "connect Google" button in the phone app signs in to
                              # Calendar and Gmail (needs a Web application OAuth client)
owner_google = false          # true (the cloud server's profile): the owner's "Connect Google
                              # account" saves the token to [calendar] token, which then wins
                              # over GOOGLE_TOKEN_JSON (used until then, and after Disconnect)
public_origin = ""            # the https:// address the phone opens (Google returns to
                              # <public_origin>/google/callback); needed for google_connect
                              # and family members' Google (PUBLIC_ORIGIN overrides it)
backup_max_mb = 200           # the owner's backup download (GET /api/backup) is refused above this
public_site = false           # true: /welcome, /privacy, /terms and the waitlist (public beta;
                              # only once beta tiers, BYOK and Notion sign-in have landed)
support_email = "support@heykwil.com"  # contact shown on /privacy and /terms ("" = "contact the owner")
legal_draft = false           # true: a visible "Draft: Kyle to review" note on /privacy and /terms (Kyle approved the wording)
waitlist_file = ""            # /welcome's waitlist (emails + notes, a private file); "" = closed.
                              # The server profile uses /data/waitlist.json (on the disk)

[voice]                       # hands-free voice conversation in the phone web app
vad = "silero"                # "silero" (browser neural VAD) or "energy" (simpler)
silence_ms = 700              # this long a pause ends your turn
min_utterance_ms = 300        # shorter sounds are ignored
max_utterance_s = 30
barge_in = "voice"            # talk over a reply to stop it; "off" if it cuts itself off (car speakers)
barge_in_ms = 250             # talk this long over a reply to interrupt it
follow_up_seconds = 5         # after a reply: soft cue + "Still listening…" this long; 0 = off
vad_threshold = 0.5           # raise (e.g. 0.7) if it hears itself on speaker
idle_timeout = 120            # seconds of quiet before the conversation ends
max_session_minutes = 30
utterances_per_minute = 30
debug_panel = false           # latency timings on the voice screen

[update]                      # automatic updates on the home host (PC tasks / Pi service)
enabled = false               # set true in config.local.toml, after signing is set up (README)
channel = "stable"
check_minutes = 15

[watch]                       # health checks: python -m kwil.watch (README "Health checks")
enabled = true                # false = don't check this instance (also per config.<name>.toml)
label = ""                    # its name in alerts and the banner; "" = "Your app" / "Mom's app"
public_url = "auto"           # the phone's address: "auto" = public_origin or `tailscale serve`; "" = none
functional_hours = 6          # the full test conversation this often (and after every restart or update)
retry_minutes = 30            # a failed test conversation is tried again after this long
gate = true                   # new code must pass the test conversation on a side port before going live
side_port_offset = 100        # side port = the instance's port + this (8765 -> 8865)
candidate_seconds = 300       # for the side-port copy to come up
start_grace_seconds = 300     # an app not answering gets this long (restart, reboot) before it's healed
rollback = true               # still failing after one restart: back to the last version that passed
restart_command = []          # self-heal; [] = its Task Scheduler task (Windows), none elsewhere
banner = true                 # your phone app shows a banner while an app is down
coordinator = true            # tell the dev team coordinator ([devteam]) when something breaks or recovers
status_file = "data/watch_status.json"
stale_minutes = 30            # the banner says the checks stopped after this long without one
cloud_url = ""                # e.g. "https://hey-claude.onrender.com": also check the cloud copy's /healthz
                              # (alerts only; this PC never restarts or rolls back the cloud)

[history]
# Every conversation (wake word, text, phone) is saved here and can be
# searched and continued: python -m kwil --history list
enabled = true
path = "data/history.sqlite"  # HISTORY_PATH in the environment overrides (Render: /data/history.sqlite)
retention_days = 0            # delete unpinned conversations older than this many days; 0 = keep forever
max_mb = 500                  # size guard: the oldest unpinned conversations are deleted above this
incognito = false             # true = save nothing (also no Pinecone summary); or run with --incognito
title_model = "claude-haiku-5-5"  # fast model that writes each conversation's title and summary

[failover]                    # Pi -> PC -> cloud for the phone app (see FAILOVER.md)
role = ""                     # "pi", "pc" or "cloud" (--role overrides); "" = not in a failover setup
app_origin = ""               # where the phone app is installed from, e.g. "https://hey-claude.onrender.com"
sync_interval = 30            # seconds between history syncs with the other backends
# The app tries these in this order. Leave a URL empty if you don't run that one.
backends = [
  { role = "pi", url = "" },     # e.g. "https://pi.tail1234.ts.net"
  { role = "pc", url = "" },     # e.g. "https://kyle-pc.tail1234.ts.net"
  { role = "cloud", url = "" },  # e.g. "https://hey-claude.onrender.com"
]

[lecture]
enabled = true                # "Record lecture" in the phone app
model = "base.en"             # faster-whisper model for lectures; "tiny.en" is faster
upload_dir = "data/lectures"  # recordings and job state (use the /data disk in the cloud)
max_upload_mb = 300           # per recording
chunk_mb = 4                  # upload piece size; a lost piece is simply resent
keep_audio = false            # true = keep the audio after it is transcribed
notes_database_id = ""        # "" = find or create "Lecture Notes" under Fall 2026 Assignments

[tutor]
enabled = true                # homework tutor in the phone app (photo + question)
max_image_mb = 8              # the phone shrinks photos to 1600 px first
max_tokens = 1200

[notes]
enabled = true                # "Remember that...": short notes in Pinecone (needs [memory])
min_score = 0.3               # how close a note must be to count as a match

[devteam]                     # talk to your dev team coordinator by voice (docs/COORDINATOR_LINK.md)
enabled = false               # needs Claude Code signed in on this machine; set it in config.local.toml
coordinator_session = ""      # the coordinator's session_... id or claude.ai/code URL
claude_command = "claude"
repo_dir = ""                 # folder to run Claude Code in ("" = this one)
timeout = 60
state_file = "data/devteam.json"  # messages waiting for a reply (voice)

[home_assistant]              # smart home by voice (README "Smart home"); owner only, never family
enabled = false               # needs a Home Assistant install: HA_URL and HA_TOKEN in .env
url = ""                      # HA_URL in .env overrides it, e.g. "http://homeassistant.local:8123"
domains = ["light", "switch", "fan", "climate", "cover", "media_player", "sensor", "lock"]  # the only kinds it may touch
scripts = []                  # script./scene./automation. entity ids it may run, e.g. ["scene.movie_time"]
secure_entities = []          # more entity ids that always need a spoken yes (e.g. a garage relay)
cache_seconds = 30            # how long the device list is kept
timeout = 10                  # seconds per request

[teamchat]                    # read Slack, Discord and GitHub; Claude sums them up (README "Team chat"); owner only
enabled = false               # then turn on the services you use; each needs its token in .env
slack = false                 # SLACK_USER_TOKEN (a user token, xoxp-)
discord = false               # DISCORD_BOT_TOKEN (a bot with Message Content Intent)
github = false                # GITHUB_TOKEN (a fine-grained, read-only token)
channels = []                 # Slack/Discord channels it may read, e.g. ["#eng", "general"]; [] = all the token sees
github_repos = []             # repos it may read, e.g. ["kylechen839-max/Kwil"]; [] = all the token sees
max_messages = 100            # messages per read or search (at most 100)
timeout = 15                  # seconds per request
digest_database_id = ""       # Notion database for chat digests; "" = find or create "Chat Digests" beside Assignments
digest_state_file = "data/teamchat_digests.json"  # remembers that database's id

[spotify]                     # "play my study playlist", "pause", "skip" (Spotify Premium; README "Spotify")
enabled = false               # needs SPOTIFY_CLIENT_ID in .env and a one-time sign-in:
                              # python -m kwil.tools.spotify (or "Connect Spotify" in the phone app)
token = "data/spotify_token.json"  # the sign-in (private file); delete it to disconnect
redirect_uri = "http://127.0.0.1:8888/callback"  # for the sign-in command; list it in your Spotify app
pause_while_listening = true  # pause Spotify on this computer at the wake word, resume afterwards
local_device = ""             # this computer's name in Spotify's device list; "" = its hostname
volume_step = 15              # "turn it up" / "turn it down" by this many percent
timeout = 10                  # seconds per Spotify request

[connect]                     # Settings -> "Connected services": sign in to your own services from the app (README "Connect your services in the app")
enabled = true                # needs USER_DATA_KEY (sign-ins are stored encrypted) and [webapp] public_origin
dir = "data/owner"            # your sealed sign-ins (Render: /data/owner)
notion = true                 # your Notion via the public integration (NOTION_OAUTH_CLIENT_ID/_SECRET); NOTION_TOKEN wins if set
home_assistant = true         # your Home Assistant's own sign-in (it must be reachable from the internet); HA_TOKEN wins if set

[push]                        # phone notifications: Settings -> "Enable notifications" (README "Study briefings")
enabled = true                # needs USER_DATA_KEY (subscriptions are stored encrypted); iPhone: Home Screen app, iOS 16.4+
owner_dir = "data/student"    # your subscriptions, briefing state and the generated VAPID key (Render: /data/student)
subject = ""                  # VAPID contact (mailto:you@example.com or https://...); "" = [webapp] public_origin
max_devices = 5               # phones/browsers per person (at most 5); the oldest is dropped
ttl = 86400                   # seconds a push service keeps a notification for a phone that's off
timeout = 10                  # seconds per push request
# VAPID_PRIVATE_KEY in .env (raw base64url P-256 key) overrides the generated key;
# a new key means every phone taps "Enable notifications" again.

[proactive]                   # study briefings as notifications; nothing runs without a subscribed device
enabled = true
check_minutes = 120           # how often the rules are looked at (plus right at the times below)
morning = "07:30"             # what's due today and tomorrow, exams this week
evening = "20:30"             # what's due tomorrow
weekly_day = "sun"            # the week ahead on this day ...
weekly_time = "18:00"         # ... at this time
quiet_start = "22:00"         # no notifications from here ...
quiet_end = "07:30"           # ... to here, in each person's own time zone
max_per_day = 2               # notifications per person per day
exam_days = 14                # exam reminders at 14, 7, 3 and 1 day(s) out, if no review is planned
class_minutes = 75            # "how did class go?" this long after a class starts
model = ""                    # Claude model that words the message; "" = [assistant] fast_model
max_tokens = 1000             # room for adaptive thinking if model is Sonnet; the message is cut to 240 characters

[family]                      # "Invite someone" in the phone app (cloud server; README "Invite family")
enabled = false               # the server profile (Render) turns it on
dir = "data/users"            # users.json + one history folder per person (Render: /data/users)
max_users = 10                # people you can invite
invite_days = 30              # an invite link works this many days, and only once
google = true                 # they may connect their own Google from their phone (Calendar, Gmail drafts)
google_client = ""            # a *Web application* OAuth client file; GOOGLE_WEB_CLIENT_JSON (its contents) overrides
public_google_client = ""     # beta testers' Calendar-only Web client (own GCP project); GOOGLE_PUBLIC_CLIENT_JSON overrides; "" = no Google for beta
notion = true                 # they may connect their own Notion Assignments database (public integration: NOTION_OAUTH_CLIENT_ID / NOTION_OAUTH_CLIENT_SECRET)
max_history_mb = 20           # each person's own history size cap (their [history] max_mb)
# Each invited person's limits (never yours); counted in memory, so a restart resets
# them; 0 = no limit. A day is their own calendar day (their time zone, else UTC).
turns_per_minute = 6          # messages (typed, push-to-talk or voice) a minute
turns_per_day = 200           # messages a day
stt_seconds_per_day = 1800    # seconds of their speech turned into text a day (30 min)
export_max_mb = 50            # "Download my data": the zip's contents (before compression) at most this big
# Each person's own Anthropic API key (Settings -> "Your Anthropic API key"): beta
# testers must add one (they pay for their own use); family members may. Stored
# encrypted in <dir>/<id>/anthropic_key.enc with a key derived from the env secret
# USER_DATA_KEY (no config setting; Render generates it; without it keys aren't stored).
zh_stt_model = "small"        # Whisper model for Chinese-speaking family members (loaded on first use; ZH_WHISPER_MODEL overrides)
zh_piper_voice = "voices/zh_CN-huayan-medium.onnx"  # their Piper voice (python -m kwil --download-voice zh_CN-huayan-medium)

[student]                     # school deadlines from Canvas, emails or said by hand (README "Student deadlines")
enabled = true                # the deadline tools and the phone app's "What I captured" card
dir = "data/student"          # your deadlines.sqlite (Render: /data/student); invited people's live in [family] dir/<id>/
sync_minutes = 15             # "Sync now" at most this often per person
gmail = true                  # also read Canvas's notification emails (read-only), once Gmail is connected
extract_model = ""            # the model that reads emails and pages into deadlines; "" = [assistant] fast_model
max_items = 2000              # deadlines kept per person
max_per_source = 500          # ... and per source (calendar feed, Canvas API, emails, ...)

[canvas]                      # where deadlines come from; a feed link or an access token, never a school password
# Everyone, you included, pastes a link in the app's School deadlines card (sealed with
# USER_DATA_KEY). Or, the older way: CANVAS_ICS_URL (Canvas -> Calendar -> Calendar Feed)
# or CANVAS_TOKEN (Account -> Settings -> New access token) in .env, which wins while set.
base_url = ""                 # your school's Canvas for CANVAS_TOKEN, e.g. "https://canvas.school.edu" (CANVAS_BASE_URL overrides)
pages = false                 # also read module pages (Claude picks the dates out; one call per sync when pages changed)
max_pages = 20                # module pages read per sync, at most
timeout = 15                  # seconds per Canvas request
# Course content (with an access token): each active course's syllabus, pages, assignment
# descriptions, announcements and files (PDF, Word, PowerPoint, HTML, text) kept as text
# you can search by voice; dates found become unconfirmed drafts. Never media or grades.
content = true                # read course content too
auto_sync_hours = 6           # sync everyone connected in the background this often; 0 = only "Sync now"
max_files = 40                # files downloaded per sync, at most (the rest next time)
max_file_mb = 20              # one file's size, at most (bigger: listed, not read; Render: 4)
max_course_mb = 20            # text kept per course, at most
max_person_mb = 100           # text kept per person, at most
content_seconds = 300         # time for one person's content step
helper = true                 # accept course content from the Kwil Canvas helper (a browser extension) in each person's own Canvas tab
tokens_for = "everyone"       # who may connect with an access token: "everyone", or "owner" (invited people get the helper or the feed)

[logging]
file = "logs/assistant.log"
level = "INFO"
