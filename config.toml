# Hey Claude settings. Secrets (API keys) go in .env, not here.
# Any value left out uses the built-in default (see assistant/config.py).

[assistant]
model = "claude-sonnet-5-5"   # CLAUDE_MODEL in the environment overrides this
max_tokens = 1500            # a ceiling, not a target: room for thinking and web search
conversation_timeout = 300    # seconds of quiet before a new conversation starts
timezone = ""                 # e.g. "America/New_York"; empty = system time zone

[tts]
# "auto" (default): Kokoro if its files are downloaded, else Piper, else pyttsx3.
# Or pick one: "kokoro" (most natural), "piper" (fast, best on a Raspberry Pi),
# "pyttsx3" (OS voice), "elevenlabs" (optional, paid cloud voice), "print".
# A missing voice falls back down that list, with one log line saying why.
engine = "auto"
# Kokoro: get it with  python -m assistant --download-voice kokoro
kokoro_voice = "af_heart"     # warm and calm; also af_bella, bf_emma, am_michael (README)
speed = 1.0                   # Kokoro 0.5-2.0, ElevenLabs 0.7-1.2
kokoro_model = "models/kokoro/kokoro-v1.0.int8.onnx"
kokoro_voices = "models/kokoro/voices-v1.0.bin"
# Piper voice (.onnx, with its .onnx.json next to it).
# Get one with: python -m assistant --download-voice en_US-lessac-medium
piper_voice = "voices/en_US-lessac-medium.onnx"
rate = 185                    # pyttsx3 only
voice = ""                    # pyttsx3 only: part of a voice name, e.g. "Zira" on Windows
# ElevenLabs: only with engine = "elevenlabs" and ELEVENLABS_API_KEY in .env.
elevenlabs_voice = ""         # a voice ID from your ElevenLabs library; "" = Rachel
elevenlabs_model = "eleven_flash_v2_5"

[stt]
model = "base.en"             # faster-whisper model; "tiny.en" is faster on a Pi
device = "cpu"
compute_type = "int8"

[wake]
keyword_path = "keywords/hey_claude.onnx"  # openWakeWord model (Windows and Pi)
builtin_keyword = "hey_jarvis"  # used if keyword_path is missing: hey_jarvis, alexa, hey_mycroft, hey_rhasspy
sensitivity = 0.5             # 0-1; higher = fewer misses, more false wakes
chime = true
silence_ms = 800              # how long a pause ends your command
max_seconds = 15
no_speech_timeout = 5
follow_up_seconds = 5         # after a reply, keep listening this long without the wake word; 0 = off
follow_up_chime = true        # soft blip when that window opens (only if chime = true)
mic_device = ""               # "" = default mic

[calendar]
enabled = true
credentials = "credentials.json"
token = "token.json"
calendar_id = "primary"

[notion]
enabled = true
database_id = "7eefabe3-0226-47a8-a287-584be0d2ea9b"   # Fall 2026 Assignments

[web]
enabled = true
search = true                 # search the web (runs on Anthropic's servers)
fetch = true                  # read a specific web page
browser = true                # open pages in this computer's default browser
max_searches = 3              # per question
max_fetches = 3
max_fetch_tokens = 8000       # cap on each page read
allowed_domains = []          # only use these sites, e.g. ["wikipedia.org"], or
blocked_domains = []          # never use these sites (set one list, not both)
# Approximate location for local results ("weather", "open near me").
location = { city = "", region = "", country = "", timezone = "" }
# e.g. location = { city = "Atlanta", region = "Georgia", country = "US", timezone = "America/New_York" }

[memory]
enabled = true
index = "project-context"
namespace = "voice-assistant" # where conversation summaries are written
search_namespaces = "*"       # "*" = read all namespaces, or a list like ["projects"]
top_k = 4
min_score = 0.4
text_fields = ["text", "chunk_text", "content", "summary"]  # metadata field(s) holding a note's text

[webapp]                      # python -m assistant --mode web (phone page)
host = "127.0.0.1"            # keep this: reach it through `tailscale serve`
port = 8765
confirm_timeout = 120         # seconds to wait for a yes before treating it as no
max_upload_mb = 10
max_audio_seconds = 60        # longest recording accepted
trusted_proxy = 0             # 0 = none; 1 behind a TLS proxy such as Render; or the proxy's
                              # address, e.g. "127.0.0.1" for tailscale serve (TRUSTED_PROXY)

[voice]                       # hands-free voice conversation in the phone web app
vad = "silero"                # "silero" (browser neural VAD) or "energy" (simpler)
silence_ms = 700              # this long a pause ends your turn
min_utterance_ms = 300        # shorter sounds are ignored
max_utterance_s = 30
barge_in_ms = 250             # talk this long over a reply to interrupt it
vad_threshold = 0.5           # raise (e.g. 0.7) if it hears itself on speaker
idle_timeout = 120            # seconds of quiet before the conversation ends
max_session_minutes = 30
utterances_per_minute = 30
debug_panel = false           # latency timings on the voice screen

[logging]
file = "logs/assistant.log"
level = "INFO"
