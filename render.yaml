# Render Blueprint (render.com): Dashboard -> New -> Blueprint -> this repo.
#  - hey-claude: the Kwil phone web app (python -m kwil --mode web) running
#    24/7 from the Dockerfile, so it works with Kyle's PC off. Setup steps:
#    README "Run it in the cloud (Render)".
#  - pinecone-mcp: the Pinecone MCP connector (pinecone-mcp/).
services:
  - type: web
    # Keeps its pre-rebrand name on purpose: the Blueprint matches services by
    # this name, so renaming it would create a NEW service with an empty disk
    # (and a new URL). The display name is changed in Render's dashboard.
    name: hey-claude
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Measured (PROGRESS.md, "Cloud hosting"): base.en + Piper peaks at
    # 465-564 MB, more than Starter's 512 MB; Standard (2 GB, $25/month) has
    # room. Starter ($7) only with WHISPER_MODEL=tiny.en, and tightly. A
    # Chinese-speaking family member's first words also load Whisper small
    # and the Mandarin voice (estimated 0.5-0.7 GB more, not measured yet:
    # PROGRESS.md "Family invites, piece B"): keep Standard for family use.
    plan: standard
    healthCheckPath: /healthz
    # Persistent disk (paid instance types only; $0.25/GB a month): history,
    # lecture audio, job state, and family members' accounts (/data/users:
    # their history and their own Google tokens; [family] dir in the server
    # profile). Snapshotted daily by Render; export too.
    # A service with a disk runs one instance and redeploys with a short gap.
    disk:
      name: hey-claude-data   # never renamed either: a new name is a new, empty disk
      mountPath: /data
      sizeGB: 1
    envVars:
      # Secrets: Render asks for each one when the Blueprint is created.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      # Optional: leave empty and connect your Notion from the app instead
      # (Settings -> Connected services; README "Connect your services in
      # the app"). Set, it wins and the app's Connect is hidden. Home
      # Assistant works the same way: no HA_TOKEN/HA_URL needed here.
      - key: NOTION_TOKEN
        sync: false
      # Optional: the owner's ⚙ -> Connect Google account saves a token to
      # /data/google_token.json, which wins; these stay the fallback.
      - key: GOOGLE_TOKEN_JSON      # the whole contents of token.json
        sync: false
      - key: GOOGLE_CLIENT_JSON     # the whole contents of credentials.json
        sync: false
      - key: ASSISTANT_TIMEZONE     # e.g. America/New_York ("tomorrow" is in this zone)
        sync: false
      # The phone's sign-in token: Render makes a random one (256 bits).
      - key: WEB_TOKEN
        generateValue: true
      # base.en (better) or tiny.en (smaller, faster); both are baked into the
      # image. Not small.en (the PC's default): its RAM here is unmeasured.
      # Beam search 5 and the vocabulary prompt come from config.toml.
      - key: WHISPER_MODEL
        value: base.en
      # Optional, paid, more accurate: "openai" or "deepgram" with that
      # service's key below (README "Cloud speech-to-text"). Then the
      # speech sent to this server is also sent to that service; on any
      # error base.en transcribes it. Empty = local Whisper only.
      - key: STT_ENGINE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DATA_DIR               # on the persistent disk
        value: /data
      - key: HISTORY_PATH
        value: /data/history.sqlite
      # Family members (README "Invite family") and the owner: the Google
      # sign-in from the phone needs this service's address and a *Web
      # application* OAuth client whose redirect URI is
      # <PUBLIC_ORIGIN>/google/callback. Left empty, invites still work and
      # the "Connect Google account" button stays hidden.
      - key: PUBLIC_ORIGIN          # https://heykwil.com
        sync: false
      - key: GOOGLE_WEB_CLIENT_JSON # the whole contents of that client's JSON file
        sync: false
      # Beta testers' (invite tier "beta") Calendar-only Web client, from a
      # separate Google Cloud project. Left empty, beta testers can't
      # connect Google (they never use the family client above).
      - key: GOOGLE_PUBLIC_CLIENT_JSON
        sync: false
      # Invited people's own Notion (notion_web.py): a *public* Notion
      # integration whose redirect URI is <PUBLIC_ORIGIN>/notion/callback.
      # Left empty, the "Connect Notion" button stays hidden.
      - key: NOTION_OAUTH_CLIENT_ID
        sync: false
      - key: NOTION_OAUTH_CLIENT_SECRET
        sync: false
      # Optional, the older way: your own Canvas for school deadlines (README
      # "Student deadlines"), the Calendar Feed link (it is a secret), or an
      # access token with CANVAS_BASE_URL. Leave them empty and connect
      # Canvas in the app's School deadlines card instead (stored encrypted
      # on the disk); while either is set, it wins over the app.
      - key: CANVAS_ICS_URL
        sync: false
      - key: CANVAS_TOKEN
        sync: false
      - key: CANVAS_BASE_URL        # e.g. https://canvas.school.edu
        sync: false
      # Encrypts each tester's own Anthropic API key on the disk (userkeys.py),
      # and their Notion sign-in and Canvas link, and your own Connected
      # services' sign-ins (/data/owner).
      # Render makes a random one; keep it: if it changes, everyone has to
      # enter their key again (nothing else breaks). Never share it.
      - key: USER_DATA_KEY
        generateValue: true
      - key: ZH_WHISPER_MODEL       # Chinese speech recognition (baked into the image)
        value: small
      # Optional crash reports (README "Uptime, error tracking and
      # backups"): a Sentry project's DSN; empty = off (nothing is sent).
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: pinecone-mcp
    runtime: node
    rootDir: pinecone-mcp
    # free plan sleeps after ~15 min idle; the first call after that takes ~1 min.
    # Switch to "starter" (paid) in the Render dashboard if that is too slow.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: PINECONE_API_KEY
        sync: false
      - key: MCP_SECRET
        generateValue: true
      - key: DEFAULT_INDEX
        value: project-context
      - key: ALLOW_WRITES
        value: "false"
