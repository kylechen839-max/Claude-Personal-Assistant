<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hey Claude hub</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/devteam.css">
</head>
<body>
<main id="main">
<header class="toolbar" id="toolbar">
<h1>Hey Claude hub</h1>
<p id="count"></p>
<details id="tray" hidden>
<summary id="tray-sum">Hidden (0)</summary>
<div id="tray-pop">
<div id="tray-list" role="list"></div>
<button type="button" id="showall">Show all</button>
</div>
</details>
</header>
<p id="note" class="note" hidden></p>
<section id="login" hidden>
<h2>Sign in</h2>
<p>Paste the web access token (from <code>python -m assistant --mode web --show-token</code>, or WEB_TOKEN in .env).</p>
<div class="row"><input id="token" type="password" autocomplete="current-password" aria-label="Access token">
<button type="button" id="login-go">Sign in</button></div>
<p id="login-hint" class="hint" hidden></p>
</section>
<div id="wins" aria-label="Coordinator windows"></div>
<p id="live" class="sr" aria-live="polite"></p>
</main>
<script src="/devteam.js"></script>
</body>
</html>
